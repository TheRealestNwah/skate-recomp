# The presentation reader takes the newest snapshot once per frame. Keep
# its publication rate at 60 Hz and feed every sample to the gesture path.
[[midasm_hook]]
address = 0x82578AE8
name = "SkateSkipPresentationInput"
registers = ["r31"]
jump_address_on_true = 0x82578AEC

# The state decoder serves both readers. r12 holds the return address just
# after mflr, and the caller's r28 identifies the snapshot ring.
[[midasm_hook]]
address = 0x82BBCEC0
name = "SkateSelectInputButtonTiming"
registers = ["r12", "r28"]
after_instruction = true

# Keep wall-clock repeat and debounce times on the 120 Hz reader.
[[midasm_hook]]
address = 0x82BBCF28
name = "SkateAdjustInputRepeat"
registers = ["r3", "r4"]
after_instruction = true

[[midasm_hook]]
address = 0x82BBCF4C
name = "SkateAdjustInputDebounce"
registers = ["r10", "cr6", "xer"]
after_instruction = true

# Observe the guest swap submission immediately after the call to VdSwap.
[[midasm_hook]]
address = 0x82CCC0E4
name = "SkateRecordGuestSwap"
after_instruction = true

# Back off sustained polling in the guest graphics command buffer wait.
[[midasm_hook]]
address = 0x82CB4ABC
name = "SkateBackOffGraphicsWait"
