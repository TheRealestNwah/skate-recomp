name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
      - name: Guard against committed game files
        run: |
          if git ls-files | grep -Ei '\.(xex|iso|god|xcp|big|arena)$'; then
            echo "Game binaries/assets must not be committed." >&2
            exit 1
          fi

  tooling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax and local config template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem scripts -Filter '*.ps1' -Recurse | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
          Get-Content -Raw local.json.example | ConvertFrom-Json | Out-Null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test the BIG directory and EB header parsers with synthetic archives
        run: python -B -m unittest discover -s tools -p 'test_*.py'
