name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
      - name: Guard against committed game files
        run: |
          if git ls-files | grep -Ei '\.(xex|iso|god|xcp|big|arena)$'; then
            echo "Game binaries/assets must not be committed." >&2
            exit 1
          fi
